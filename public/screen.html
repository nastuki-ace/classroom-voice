<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂大屏</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:#0b1220;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;transition:background .2s}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px}
  .brand{font-size:20px;font-weight:600;letter-spacing:.04em;color:#cbd5e1;cursor:pointer}
  .right{display:flex;align-items:center;gap:18px}
  .conn{display:flex;align-items:center;gap:8px;font-size:15px;color:#94a3b8}
  .dot{width:10px;height:10px;border-radius:50%;background:#f43f5e;transition:.2s}
  .dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
  button.ghost{padding:10px 18px;border:1px solid #1e293b;border-radius:999px;background:#111a2e;
    color:#cbd5e1;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
  button.ghost:hover{border-color:#3b82f6;color:#fff}
  button.ghost:disabled{opacity:.5;cursor:default}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center}
  #msg{font-size:clamp(40px,9vw,140px);font-weight:800;line-height:1.25;letter-spacing:.02em;
    max-width:95%;opacity:0;transform:translateY(24px);
    transition:opacity .4s cubic-bezier(.2,.7,.3,1),transform .4s cubic-bezier(.2,.7,.3,1),color .2s}
  #msg.show{opacity:1;transform:none}
  #msg.idle{color:#334155;font-size:clamp(26px,4vw,54px)}
  #msg.urgent{color:#f87171;text-shadow:0 0 70px rgba(248,113,113,.4)}
  .clock{position:fixed;right:40px;bottom:24px;font-size:18px;color:#475569;font-variant-numeric:tabular-nums}
  body.flash{animation:flash .55s 2}
  @keyframes flash{50%{background:#1f0b0b}}
  #picker{position:fixed;inset:0;background:#0b1220;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:30px;z-index:20}
  #picker h2{font-size:clamp(26px,4vw,44px);margin:0;font-weight:700}
  #picker .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:16px;width:min(84vw,820px)}
  #picker button{padding:26px;font-size:26px;font-weight:700;border:2px solid #1e293b;
    border-radius:20px;background:#111a2e;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
  #picker button:hover{border-color:#3b82f6;background:#16243f}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand">课堂大屏</div>
  <div class="right">
    <button class="ghost" id="switchBtn">切换班级</button>
    <button class="ghost" id="voiceBtn">🔊 启用语音</button>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">未连接</span></div>
  </div>
</header>

<main>
  <div id="msg" class="idle">等待老师发送通知…</div>
</main>

<div class="clock" id="clock"></div>

<div id="picker">
  <h2>请选择本班教室</h2>
  <div class="grid" id="pickerGrid"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
let socket = null;
let classes = [];
let classId = null;
let voiceEnabled = false;

init();

async function init() {
  try { classes = await (await fetch('/api/classes')).json(); } catch { classes = []; }
  renderPicker();
  updateClock();
  setInterval(updateClock, 1000);

  $('#voiceBtn').addEventListener('click', enableVoice);
  $('#switchBtn').addEventListener('click', () => { $('#picker').style.display = 'flex'; });
  $('#brand').addEventListener('click', () => { $('#picker').style.display = 'flex'; });

  // 记住上次选的班级
  const saved = localStorage.getItem('screenClass');
  if (saved && classes.some(c => c.id === saved)) selectClass(saved);
}

function renderPicker() {
  $('#pickerGrid').innerHTML = classes
    .map(c => `<button data-id="${c.id}">${c.name}</button>`).join('');
  $('#pickerGrid').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => selectClass(btn.dataset.id));
  });
}

function selectClass(id) {
  classId = id;
  localStorage.setItem('screenClass', id);
  const cls = classes.find(c => c.id === id);
  $('#brand').textContent = (cls ? cls.name : '') + ' · 课堂大屏';
  $('#picker').style.display = 'none';

  if (!socket) {
    socket = io();
    socket.on('connect', () => {
      setConn(true);
      socket.emit('join', { role: 'screen', classId });
    });
    socket.on('disconnect', () => setConn(false));
    socket.on('connect_error', () => setConn(false));
    socket.on('message:new', onMessage);
  } else {
    socket.emit('join', { role: 'screen', classId });
  }
}

function onMessage(msg) {
  if (msg.classId !== classId) return;

  const el = $('#msg');
  el.classList.remove('show', 'urgent', 'idle');
  el.textContent = msg.text;
  void el.offsetWidth; // 重排以重放动画
  el.classList.add('show');

  if (msg.urgent) {
    el.classList.add('urgent');
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 1200);
  }

  speak(msg.text, msg.urgent ? 2 : 1);
}

function speak(text, times = 1) {
  if (!voiceEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  for (let i = 0; i < times; i++) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }
}

function enableVoice() {
  voiceEnabled = true;
  speak('语音播报已开启');
  const btn = $('#voiceBtn');
  btn.textContent = '🔊 语音已开启';
  btn.disabled = true;
}

function setConn(ok) {
  $('#dot').classList.toggle('on', ok);
  $('#connText').textContent = ok ? '已连接' : '已断开';
}

function updateClock() {
  const d = new Date();
  $('#clock').textContent =
    d.toLocaleDateString('zh-CN') + ' ' +
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0') + ':' +
    String(d.getSeconds()).padStart(2, '0');
}
</script>
</body>
</html>
