<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂大屏</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;height:100vh;overflow:hidden;background:#0b1220;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;transition:background .2s;
  }
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;flex-shrink:0}
  .brand{font-size:20px;font-weight:600;letter-spacing:.04em;color:#cbd5e1}
  .right{display:flex;align-items:center;gap:18px}
  .conn{display:flex;align-items:center;gap:8px;font-size:15px;color:#94a3b8}
  .dot{width:10px;height:10px;border-radius:50%;background:#f43f5e;transition:.2s}
  .dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)}
  
  button.ghost, select.ghost{
    padding:10px 18px;border:1px solid #1e293b;border-radius:999px;background:#111a2e;
    color:#cbd5e1;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;outline:none;
  }
  button.ghost:hover, select.ghost:hover{border-color:#3b82f6;color:#fff}
  select.ghost{max-width:200px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;}
  select.ghost option{background:#111a2e; color:#fff;}
  
  /* 核心修改：绝对居中容器，防止 flex 溢出裁切 */
  main{
    flex:1; position:relative; display:block; padding:40px; overflow:hidden;
  }
  
    #msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    width: max-content; /* 关键修复：宽度由文字内容撑开 */
    max-width: 92vw;    /* 限制最大宽度，长文字会自动换行 */
    text-align:center;
    font-weight:800; line-height:1.2; letter-spacing:.02em;
    opacity:0;
    transition:opacity .4s, color .2s;
    word-wrap:break-word; white-space:pre-wrap;
  }
  #msg.show{opacity:1}
  #msg.idle{color:#334155}
  #msg.urgent{color:#f87171;text-shadow:0 0 70px rgba(248,113,113,.4)}
  
  .clock{position:fixed;right:40px;bottom:24px;font-size:18px;color:#475569;font-variant-numeric:tabular-nums}
  body.flash{animation:flash .55s 2}
  @keyframes flash{50%{background:#1f0b0b}}
  
  /* 三级联动选择器样式 */
  #picker{position:fixed;inset:0;background:#0b1220;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:30px;z-index:20}
  #picker h2{font-size:clamp(26px,4vw,44px);margin:0;font-weight:700}
  #picker .step{display:none; flex-direction:column; align-items:center; width:100%;}
  #picker .step.active{display:flex;}
  #picker .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:20px;width:min(84vw,1000px);margin-top:20px;}
  #picker button{padding:26px;font-size:26px;font-weight:700;border:2px solid #1e293b;
    border-radius:20px;background:#111a2e;color:#fff;cursor:pointer;font-family:inherit;transition:.15s}
  #picker button:hover{border-color:#3b82f6;background:#16243f;transform:scale(1.02)}
  .back-btn{background:none;border:none;color:#64748b;font-size:18px;cursor:pointer;margin-top:20px;}
  .back-btn:hover{color:#fff;}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand">课堂大屏</div>
  <div class="right">
    <button class="ghost" id="switchBtn">切换班级</button>
    <select class="ghost" id="voiceSelect">
      <option value="">🔊 请选择音色...</option>
    </select>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">未连接</span></div>
  </div>
</header>

<main>
  <div id="msg" class="idle">等待老师发送通知…</div>
</main>

<div class="clock" id="clock"></div>

<!-- 三级联动选择器 -->
<div id="picker">
  <div class="step active" id="step-stage">
    <h2>请选择学段</h2>
    <div class="grid">
      <button onclick="selectStage('小学')">小学</button>
      <button onclick="selectStage('初中')">初中</button>
      <button onclick="selectStage('高中')">高中</button>
    </div>
  </div>
  <div class="step" id="step-grade">
    <h2 id="title-grade">请选择年级</h2>
    <div class="grid" id="grid-grade"></div>
    <button class="back-btn" onclick="goBack('stage')">← 返回学段选择</button>
  </div>
  <div class="step" id="step-class">
    <h2 id="title-class">请选择班级</h2>
    <div class="grid" id="grid-class"></div>
    <button class="back-btn" onclick="goBack('grade')">← 返回年级选择</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
let socket = null;
let voiceEnabled = false;
let currentVoice = null;

let currentStage = '';
let currentGrade = '';

init();

function init() {
  updateClock();
  setInterval(updateClock, 1000);
  $('#switchBtn').addEventListener('click', () => {
    $('#picker').style.display = 'flex';
    goBack('stage');
  });
  initVoices();

  const savedConfig = localStorage.getItem('screenConfig');
  if (savedConfig) {
    const config = JSON.parse(savedConfig);
    $('#picker').style.display = 'none';
    connectToClass(config.id, config.fullName);
  }
}

/* ================= 语音相关 ================= */
function initVoices() {
  const select = $('#voiceSelect');
  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    const zhVoices = voices.filter(v => v.lang.includes('zh') || v.lang.includes('cmn'));
    if (zhVoices.length > 0 && select.options.length <= 1) {
      zhVoices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        let displayName = v.name.replace('Microsoft ', '').replace(' Online (Natural)', '');
        opt.textContent = displayName;
        select.appendChild(opt);
      });
      const savedVoiceURI = localStorage.getItem('screenVoiceURI');
      if (savedVoiceURI && zhVoices.some(v => v.voiceURI === savedVoiceURI)) {
        select.value = savedVoiceURI;
        currentVoice = zhVoices.find(v => v.voiceURI === savedVoiceURI);
        voiceEnabled = true;
        select.style.borderColor = '#22c55e';
        select.style.color = '#22c55e';
      } else {
        const defaultVoice = zhVoices.find(v => v.name.includes('Xiaoxiao') || v.name.includes('晓晓')) || zhVoices[0];
        select.value = defaultVoice.voiceURI;
      }
    }
  }
  if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();

  select.addEventListener('change', (e) => {
    const voices = window.speechSynthesis.getVoices();
    currentVoice = voices.find(v => v.voiceURI === e.target.value);
    if (currentVoice) {
      voiceEnabled = true;
      localStorage.setItem('screenVoiceURI', currentVoice.voiceURI);
      select.style.borderColor = '#22c55e';
      select.style.color = '#22c55e';
      speak('语音播报已开启', 1);
    }
  });
}

function speak(text, times = 1) {
  if (!voiceEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  for (let i = 0; i < times; i++) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (currentVoice) u.voice = currentVoice;
    u.rate = 0.95;
    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  }
}

/* ================= 字体自适应核心算法 ================= */
function adjustFontSize() {
  const msgEl = document.getElementById('msg');
  const mainEl = document.querySelector('main');
  
  // 获取实际可用的宽高（减去安全边距）
  const maxWidth = mainEl.clientWidth - 80;
  const maxHeight = mainEl.clientHeight - 80;
  
  // 设置最大宽度，防止长文本超出屏幕
  msgEl.style.width = 'max-content';
  msgEl.style.maxWidth = maxWidth + 'px';
  
  let low = 20;
  let high = 200; // 短文字最大可以放到 200px
  let bestSize = 20;

  while (low <= high) {
    let mid = Math.floor((low + high) / 2);
    msgEl.style.fontSize = mid + 'px';
    
    // 强制重绘以获取准确尺寸
    void msgEl.offsetWidth; 
    
    // 判断当前字号是否能够容纳文字
    const isOverflow = msgEl.offsetWidth > maxWidth || msgEl.offsetHeight > maxHeight;
    
    if (!isOverflow) {
      bestSize = mid; 
      low = mid + 1; // 如果能装下，尝试放大
    } else {
      high = mid - 1; // 如果装不下，尝试缩小
    }
  }
  
  msgEl.style.fontSize = bestSize + 'px';
}

/* ================= 消息处理 ================= */
function onMessage(msg) {
  const el = $('#msg');
  el.classList.remove('show', 'urgent', 'idle');
  el.textContent = msg.text;
  void el.offsetWidth;
  
  adjustFontSize(); // 先计算缩放，再显示
  
  el.classList.add('show');

  if (msg.urgent) {
    el.classList.add('urgent');
    document.body.classList.add('flash');
    setTimeout(() => document.body.classList.remove('flash'), 1200);
  }
  speak(msg.text, msg.urgent ? 2 : 1);
}

/* ================= 选择器逻辑 ================= */
function selectStage(stage) {
  currentStage = stage;
  $('#title-grade').textContent = `请选择【${stage}】的年级`;
  let grades = stage === '小学' ? ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'] : (stage === '初中' ? ['初一', '初二', '初三'] : ['高一', '高二', '高三']);
  $('#grid-grade').innerHTML = grades.map(g => `<button onclick="selectGrade('${g}')">${g}</button>`).join('');
  goToStep('grade');
}
function selectGrade(grade) {
  currentGrade = grade;
  $('#title-class').textContent = `请选择【${currentStage} - ${grade}】的班级`;
  let classBtns = [];
  for (let i = 1; i <= 15; i++) classBtns.push(`<button onclick="selectClass(${i})">${i} 班</button>`);
  $('#grid-class').innerHTML = classBtns.join('');
  goToStep('class');
}
function selectClass(classNum) {
  const fullName = `${currentStage}${currentGrade}${classNum}班`;
  const id = `${currentStage}_${currentGrade}_${classNum}`;
  localStorage.setItem('screenConfig', JSON.stringify({ id, fullName }));
  $('#picker').style.display = 'none';
  connectToClass(id, fullName);
}
function goToStep(step) {
  document.querySelectorAll('#picker .step').forEach(el => el.classList.remove('active'));
  $(`#step-${step}`).classList.add('active');
}
function goBack(step) {
  if (step === 'stage') { goToStep('stage'); }
  else if (step === 'grade') { goToStep('grade'); }
}
function connectToClass(classId, fullName) {
  $('#brand').innerHTML = `📺 当前教室：<span style="color:#3b82f6; font-size:1.2em; font-weight:900;">${fullName}</span>`;
  if (!socket) {
    socket = io();
    socket.on('connect', () => { setConn(true); socket.emit('join', { role: 'screen', classId }); });
    socket.on('disconnect', () => setConn(false));
    socket.on('connect_error', () => setConn(false));
    socket.on('message:new', onMessage);
  } else {
    socket.emit('join', { role: 'screen', classId });
  }
}
function setConn(ok) {
  $('#dot').classList.toggle('on', ok);
  $('#connText').textContent = ok ? '已连接' : '已断开';
}
function updateClock() {
  const d = new Date();
  $('#clock').textContent = d.toLocaleDateString('zh-CN') + ' ' +
    String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0') + ':' +
    String(d.getSeconds()).padStart(2, '0');
}
</script>
</body>
</html>
