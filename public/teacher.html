<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教师端 · 课堂喊话</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#f4f7fb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom);}
  header{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.86);backdrop-filter:blur(12px);border-bottom:1px solid #e6edf6;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
  .conn{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;transition:.2s}
  .conn .dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .conn .dot.off{background:#f43f5e;box-shadow:0 0 0 3px rgba(244,63,94,.15)}

  main{max-width:720px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:16px}
  .card{background:#fff;border:1px solid #e6edf6;border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
  .label{font-size:13px;font-weight:600;color:#475569;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* 当前班级显示 */
  .current-class-box{display:flex;justify-content:space-between;align-items:center;background:#eff6ff;border:1px solid #bfdbfe;padding:12px 16px;border-radius:12px;}
  .current-class-name{font-size:16px;font-weight:700;color:#1d4ed8;}
  .change-btn{background:#fff;border:1px solid #93c5fd;color:#2563eb;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}

  textarea{width:100%;min-height:120px;resize:vertical;border:1.5px solid #e6edf6;border-radius:14px;padding:14px;font-family:inherit;font-size:17px;line-height:1.6;color:#0f172a;background:#fcfdff;outline:none;transition:border-color .15s,box-shadow .15s;}
  textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(59,130,246,.10);background:#fff}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid #e6edf6;background:#f8fafc;color:#475569;cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}

  .row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
  .switch{display:flex;align-items:center;gap:8px;font-size:14px;color:#475569;cursor:pointer;user-select:none}
  .switch input{width:18px;height:18px;accent-color:#ef4444}

  .primary{width:100%;margin-top:16px;padding:16px;border:none;border-radius:14px;background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.02em;box-shadow:0 8px 20px -8px rgba(37,99,235,.7);transition:transform .12s,filter .15s;}
  .primary:active{transform:scale(.985)}
  .primary:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed}
  .primary.urgent{background:linear-gradient(180deg,#f87171,#ef4444);box-shadow:0 8px 20px -8px rgba(239,68,68,.7)}

  #recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  #recent li{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;background:#f8fafc;border-radius:10px}
  #recent .time{color:#94a3b8;font-size:12px;flex:none}
  #recent .txt{flex:1;word-break:break-word;line-height:1.5}
  #recent li.urgent{background:#fef2f2;color:#b91c1c}
   /* 新增：消息状态样式 */
  .status { font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-left: 8px; white-space: nowrap; }
  .status-pending { background: #f1f5f9; color: #64748b; }
  .status-acked { background: #dcfce7; color: #16a34a; font-weight: 600; }
  #recent .empty{color:#94a3b8;font-size:13px;justify-content:center}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;max-width:90vw;box-shadow:0 10px 30px -10px rgba(15,23,42,.5);}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:#dc2626}
  .toast.ok{background:#16a34a}

  /* 三级联动弹窗 */
  #picker-modal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  #picker-modal.show{display:flex;}
  .picker-content{background:#fff;width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:24px;animation:slideUp .3s cubic-bezier(.2,.7,.3,1);}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .picker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .picker-header h3{margin:0;font-size:18px;}
  .picker-close{background:none;border:none;font-size:24px;color:#94a3b8;cursor:pointer;}
  .step-container{display:none;}
  .step-container.active{display:block;}
  .step-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .step-grid button{padding:14px 0;border-radius:12px;border:1.5px solid #e6edf6;background:#f8fafc;font-size:15px;font-weight:600;color:#334155;cursor:pointer;font-family:inherit;}
  .step-grid button:active{background:#eff6ff;border-color:#3b82f6;color:#1d4ed8;}
  .step-back{background:none;border:none;color:#64748b;font-size:14px;cursor:pointer;padding:0;margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <h1>📣 课堂喊话</h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
</header>

<main>
  <!-- 目标班级显示 -->
  <section class="card" style="padding:14px">
    <div class="current-class-box">
      <div class="current-class-name" id="displayClass">未选择班级</div>
      <button class="change-btn" onclick="openPicker()">切换</button>
    </div>
  </section>

  <section class="card">
    <div class="label"><span>输入通知内容</span><span id="counter" style="font-weight:400;color:#94a3b8;font-size:12px">0/200</span></div>
    <textarea id="msgInput" maxlength="200" placeholder="例如：请同学们安静，翻到课本第 12 页"></textarea>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="urgent"> 紧急通知（红色高亮 + 播报两遍）</label>
    </div>
    <button class="primary" id="sendBtn" disabled>一键发送</button>
  </section>

  <section class="card">
    <div class="label">
      <span>最近发送</span>
      <button id="clearRecent" style="border:none;background:none;color:#94a3b8;font-size:12px;cursor:pointer;font-family:inherit">清空</button>
    </div>
    <ul id="recent"><li class="empty">暂无记录</li></ul>
  </section>
</main>

<!-- 三级联动选择器 (底部弹窗) -->
<div id="picker-modal">
  <div class="picker-content">
    <div class="picker-header">
      <h3>选择发送目标</h3>
      <button class="picker-close" onclick="closePicker()">×</button>
    </div>

    <div class="step-container active" id="m-step-stage">
      <div class="step-grid">
        <button onclick="mSelectStage('小学')">小学</button>
        <button onclick="mSelectStage('初中')">初中</button>
        <button onclick="mSelectStage('高中')">高中</button>
      </div>
    </div>

    <div class="step-container" id="m-step-grade">
      <button class="step-back" onclick="mGoBack('stage')">← 返回学段</button>
      <div class="step-grid" id="m-grid-grade"></div>
    </div>

    <div class="step-container" id="m-step-class">
      <button class="step-back" onclick="mGoBack('grade')">← 返回年级</button>
      <div class="step-grid" id="m-grid-class"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = s => document.querySelector(s);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const QUICK = ['请安静，现在开始上课', '请翻到课本第 __ 页', '这道题给大家 3 分钟', '请全体起立，排队集合'];

let socket, selectedClass = null, selectedClassName = '', presence = {}, recent = [];
let mStage = '', mGrade = '';

init();

async function init() {
  renderChips();
  restoreRecent();
  connect();

  $('#sendBtn').addEventListener('click', send);
  $('#urgent').addEventListener('change', updateSendState);
  $('#msgInput').addEventListener('input', updateCounter);
  $('#clearRecent').addEventListener('click', () => {
    recent = []; localStorage.removeItem('recentMsgs'); renderRecent();
  });

  // 检查本地是否已选过班级
  const savedConfig = localStorage.getItem('teacherConfig');
  if (savedConfig) {
    const config = JSON.parse(savedConfig);
    setSelectedClass(config.id, config.fullName);
  } else {
    openPicker(); // 没选过，直接弹窗
  }
}

/* ---------- 网络连接 ---------- */
function connect() {
  socket = io();
  socket.on('connect', () => {
    setConn('on', '已连接');
    if (selectedClass) socket.emit('join', { role: 'teacher', classId: selectedClass });
    updateSendState();
  });
  socket.on('disconnect', () => { setConn('off', '已断开'); updateSendState(); });
  socket.on('presence', onPresence);
   // 新增：监听大屏的确认反馈
  socket.on('message:acked', (messageId) => {
    const msg = recent.find(m => m.id === messageId);
    if (msg) {
      msg.acked = true;
      try { localStorage.setItem('recentMsgs', JSON.stringify(recent)); } catch {}
      renderRecent(); 
      toast('大屏已确认收到消息', 'ok');
    }
  });
}

function setConn(state, text) {
  $('#dot').className = 'dot' + (state === 'on' ? ' on' : state === 'off' ? ' off' : '');
  $('#statusText').textContent = text;
}

function onPresence(p) {
  presence[p.classId] = p.online;
  if (p.classId === selectedClass) updateSendState();
}

/* ---------- 班级选择逻辑 ---------- */
function openPicker() {
  $('#picker-modal').classList.add('show');
  mGoBack('stage'); // 默认回第一步
}
function closePicker() {
  $('#picker-modal').classList.remove('show');
}

function mSelectStage(stage) {
  mStage = stage;
  let grades = stage === '小学' ? ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'] : (stage === '初中' ? ['初一', '初二', '初三'] : ['高一', '高二', '高三']);
  
  $('#m-grid-grade').innerHTML = grades.map(g => `<button onclick="mSelectGrade('${g}')">${g}</button>`).join('');
  mGoToStep('grade');
}

function mSelectGrade(grade) {
  mGrade = grade;
  let classBtns = [];
  for (let i = 1; i <= 15; i++) classBtns.push(`<button onclick="mSelectClass(${i})">${i}班</button>`);
  $('#m-grid-class').innerHTML = classBtns.join('');
  mGoToStep('class');
}

function mSelectClass(num) {
  const fullName = `${mStage}${mGrade}${num}班`;
  const id = `${mStage}_${mGrade}_${num}`;
  
  localStorage.setItem('teacherConfig', JSON.stringify({ id, fullName }));
  setSelectedClass(id, fullName);
  closePicker();
}

function setSelectedClass(id, fullName) {
  selectedClass = id;
  selectedClassName = fullName;
  $('#displayClass').textContent = fullName;
  if (socket?.connected) socket.emit('join', { role: 'teacher', classId: id });
  updateSendState();
}

function mGoToStep(step) {
  document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
  $(`#m-step-${step}`).classList.add('active');
}
function mGoBack(step) {
  if (step === 'stage') mGoToStep('stage');
  else if (step === 'grade') mGoToStep('grade');
}

/* ---------- 发送逻辑 ---------- */
function updateSendState() {
  const connected = !!socket?.connected;
  const online = !!presence[selectedClass];
  const btn = $('#sendBtn');
  
  btn.disabled = !selectedClass || !connected;
  btn.classList.toggle('urgent', $('#urgent').checked && !btn.disabled);

  if (!selectedClass) {
    btn.textContent = '请先选择班级';
  } else {
    btn.textContent = `发送给：${selectedClassName}`;
  }
}

function send() {
  const text = $('#msgInput').value.trim();
  if (!text) return toast('请输入通知内容', 'err');
  if (!socket?.connected) return toast('与服务器断开', 'err');

  // 防误触二次确认
  if (!confirm(`⚠️ 请确认：\n即将发送到【${selectedClassName}】`)) return;

  const btn = $('#sendBtn');
  btn.disabled = true;
  btn.textContent = '发送中…';

  socket.emit('message:send',
    { classId: selectedClass, text, urgent: $('#urgent').checked },
    res => {
      updateSendState();
      if (res?.ok) {
        $('#msgInput').value = '';
        $('#urgent').checked = false;
        updateCounter();
        addRecent(res.msg);
        toast('已发送 ✓', 'ok');
        if (navigator.vibrate) navigator.vibrate(30);
      } else {
        toast(res?.error || '发送失败', 'err');
      }
    });
}

function updateCounter() {
  $('#counter').textContent = $('#msgInput').value.length + '/200';
}

/* ---------- 其他UI ---------- */
function renderChips() {
  $('#chips').innerHTML = QUICK.map(q => `<button class="chip">${escapeHtml(q)}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach((c, i) => {
    c.addEventListener('click', () => {
      $('#msgInput').value = QUICK[i];
      updateCounter();
      $('#msgInput').focus();
    });
  });
}

function addRecent(msg) {
  recent.unshift(msg);
  recent = recent.slice(0, 10);
  try { localStorage.setItem('recentMsgs', JSON.stringify(recent)); } catch {}
  renderRecent();
}

function restoreRecent() {
  try { recent = JSON.parse(localStorage.getItem('recentMsgs') || '[]'); } catch { recent = []; }
  renderRecent();
}

function renderRecent() {
  const ul = $('#recent');
  if (!recent.length) { ul.innerHTML = '<li class="empty">暂无记录</li>'; return; }
   ul.innerHTML = recent.map(m => {
    const statusText = m.acked ? '✅ 已确认' : '⌛ 待确认';
    const statusClass = m.acked ? 'status-acked' : 'status-pending';
    return `<li class="${m.urgent ? 'urgent' : ''}">
      <span class="time">${fmtTime(m.ts)}</span>
      <span class="txt">${escapeHtml(m.text)}</span>
      <span class="status ${statusClass}">${statusText}</span>
    </li>`;
  }).join('');
}

function fmtTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

let toastTimer;
function toast(msg, type = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
</body>
</html>
